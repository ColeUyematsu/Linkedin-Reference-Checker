{% extends "base.html" %}

{% block content %}
<h2>Dashboard</h2>

<!-- Add Employees Section -->
<div class="container add-employee-container">
    <h3>Add Employees</h3>
    <form method="POST" action="{{ url_for('main.add_multiple_employees') }}">
        <!-- Input Section -->
        <div id="url-container">
            <div class="url-input">
                <input 
                    type="text" 
                    name="linkedin_urls" 
                    placeholder="Employee LinkedIn URL" 
                    required
                >
                <!-- Delete Button (Moved to the right) -->
                <button 
                    type="button" 
                    class="soft-danger" 
                    onclick="removeInput(this)"
                >
                    Delete
                </button>
            </div>
        </div>
        <!-- Buttons -->
        <div class="button-container">
            <button 
                type="button" 
                class="primary" 
                onclick="addInput()"
            >
                Add Another URL
            </button>
            <button 
                type="submit" 
                class="primary"
            >
                Add Employees
            </button>
        </div>
    </form>
</div>

<!-- Upload File Section -->
<div class="container upload-container">
    <h3>Upload LinkedIn URLs File</h3>
    <form method="POST" action="{{ url_for('main.upload_file') }}" enctype="multipart/form-data">
        <div class="url-input">
            <input 
                type="file" 
                name="file" 
                accept=".txt,.csv" 
                required
            >
        </div>
        <div class="button-container">
            <button 
                type="submit" 
                class="primary"
            >
                Upload File
            </button>
        </div>
    </form>
</div>

<!-- Search Employees Section -->
<div class="container add-employee-container">
    <h3>Search Employees</h3>
    <!-- Input Section -->
    <div class="url-input">
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search by name..." 
            required
        >
        <!-- Search Button -->
        <button 
            type="button" 
            class="primary" 
            onclick="searchEmployees()"
        >
            Search
        </button>
    </div>

    <!-- Search Results -->
    <ul id="searchResults" class="list-group">
        <!-- Results will load here -->
    </ul>
</div>

<!-- JavaScript -->
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
