{% extends "base.html" %}

{% block content %}
<h2>Dashboard</h2>

<!-- Add Employees Section -->
<div class="container add-employee-container">
    <h3>Add Employees</h3>
    <form method="POST" action="{{ url_for('main.add_multiple_employees') }}">
        <!-- Input Section -->
        <div id="url-container">
            <div class="url-input">
                <input 
                    type="text" 
                    name="linkedin_urls" 
                    placeholder="Employee LinkedIn URL" 
                    required
                >
                <!-- Delete Button (Moved to the right) -->
                <button 
                    type="button" 
                    class="soft-danger" 
                    onclick="removeInput(this)"
                >
                    Delete
                </button>
            </div>
        </div>
        <!-- Buttons -->
        <div class="button-container">
            <button 
                type="button" 
                class="primary" 
                onclick="addInput()"
            >
                Add Another URL
            </button>
            <button 
                type="submit" 
                class="primary"
            >
                Add Employees
            </button>
        </div>
    </form>
</div>

<!-- Employee List Section -->
<div class="container employee-list">
    <h3>Current Employees</h3>
    <ul>
        {% for employee in employees %}
        <li class="employee">
            <!-- Collapsible Button -->
            <button class="collapsible">
                {{ employee.name }}
            </button>
            <div class="content">
                {{ employee.experience|safe }}
                <!-- Delete Form -->
                <form 
                    method="POST" 
                    action="{{ url_for('main.delete_employee', employee_id=employee.id) }}" 
                    style="display:inline;"
                >
                    <button 
                        type="submit" 
                        class="soft-danger" 
                        onclick="return confirm('Are you sure you want to delete this employee?');"
                    >
                        Delete
                    </button>
                </form>
            </div>
        </li>
        {% endfor %}
    </ul>
</div>

<!-- JavaScript -->
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
